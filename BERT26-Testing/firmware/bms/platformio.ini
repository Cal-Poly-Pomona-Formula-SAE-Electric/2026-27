; BERT26 BMS, rebuilt to BERT27 conventions.
; Build: pio run      Flash: pio run -t upload
;
; Versions are pinned to the toolchain this code was verified with (Nov 2026).
; Teensy libraries (FlexCAN_T4, EEPROM) come bundled with
; framework-arduinoteensy 1.162.0.

[env:bms]
platform = teensy@6.0.0
board = teensy41
framework = arduino
