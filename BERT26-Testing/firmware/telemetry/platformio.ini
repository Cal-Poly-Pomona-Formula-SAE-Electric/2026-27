; BERT26 telemetry node (ESP32-S3), rebuilt to BERT27 conventions.
; Build: pio run      Flash: pio run -t upload
;
; Versions are pinned to the toolchain this code was verified with (Nov 2026).

[env:telemetry]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
lib_deps = handmade0octopus/ESP32-TWAI-CAN@1.0.1
