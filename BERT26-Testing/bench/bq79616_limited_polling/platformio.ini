; BERT26 bench sketch: BQ79600 + BQ79616 stack cell voltages, NTC temps, pack stats (BMS).
; Rebuilt to BERT27 conventions. Bench use only.
; Build: pio run      Flash: pio run -t upload      Monitor: pio device monitor
;
; Versions are pinned to the toolchain this code was verified with (Nov 2026).
; Uses only the Teensy core from framework-arduinoteensy 1.162.0.

[env:bq79616_limited_polling]
platform = teensy@6.0.0
board = teensy41
framework = arduino
monitor_speed = 115200
