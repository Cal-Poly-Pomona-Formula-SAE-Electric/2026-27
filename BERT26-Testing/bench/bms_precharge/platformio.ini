; BERT26 bench sketch: precharge state machine with IMD cross-check (BMS).
; Rebuilt to BERT27 conventions. Bench use only.
; Build: pio run      Flash: pio run -t upload      Monitor: pio device monitor
;
; Versions are pinned to the toolchain this code was verified with (Nov 2026).
; Teensy libraries (FlexCAN_T4) come bundled with
; framework-arduinoteensy 1.162.0.

[env:bms_precharge]
platform = teensy@6.0.0
board = teensy41
framework = arduino
monitor_speed = 115200
